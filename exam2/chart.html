<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Primate Classification Chart</title>
<meta name="description" content="Match each trait to its place on the ANTH 102 Primate Classification chart.">
<meta name="theme-color" content="#2a46cf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../assets/drill.css">
<style>
/* Layout: the worksheet's chart, one row per rank (Order → Suborder → Infraorder → Superfamily),
   with the word bank pinned above it so a trait can be picked and placed without scrolling back. */
.wrap.wide{max-width:1040px}
.intro{display:flex;flex-direction:column;gap:6px}
.cstats{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.cstats .nums{display:flex;flex-wrap:wrap;gap:4px 16px;font:500 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.cstats .nums b{color:var(--ink)}
.cstats .acts{display:flex;gap:8px;flex-wrap:wrap}
.bank{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);max-height:40vh;overflow:auto}
.bank h2{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{font:500 14px/1.25 var(--read);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s,background .12s}
.wchip:hover{border-color:var(--accent)}
.wchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.wchip .x2{font:600 11px var(--mono);margin-left:6px;opacity:.75}
.status{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.status.good{color:var(--good)} .status.bad{color:var(--bad)}
.chart{display:flex;flex-direction:column;gap:16px}
.rank{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.rlabel{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:12px}
.row{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.taxon{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 12px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.picking .taxon:not(.full){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-style:dashed}
.taxon:hover{border-color:var(--accent)}
.taxon.full{cursor:default;border-color:var(--good);border-style:solid}
.taxon.hint{box-shadow:0 0 0 4px var(--gold-soft);border-color:var(--gold);border-style:solid}
.taxon.shake{animation:shake .4s ease}
.tname{font:700 15px/1.2 var(--display)}
.tsub{font-size:12px;color:var(--muted);margin-top:-4px}
.slots{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.slot{min-height:30px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;font:13px/1.3 var(--read);color:var(--muted)}
.slot.filled{border-style:solid;border-color:transparent;background:var(--good-soft);color:var(--ink)}
.slot.new{animation:pop .35s ease}
.slot.revealed{background:var(--sunk);color:var(--ink);border-style:solid;border-color:var(--line)}
.done-card{align-items:center;text-align:center}
.done-card h2{font:800 26px var(--display);margin:0}
@media (max-width:820px){
  .rank{grid-template-columns:1fr;gap:6px}
  .rlabel{padding-top:0}
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.one{grid-template-columns:1fr}
}
@media (max-width:440px){ .row{grid-template-columns:1fr} .bank{max-height:34vh} }
</style>
</head><body>
<div class="wrap wide">
  <header class="intro">
    <a class="back" href="index.html">← Back to the Exam 2 drill</a>
    <h1>Primate Classification Chart</h1>
    <p class="sub"><span class="origin">Source: Primate Classification worksheet</span> Tap a trait, then tap the box on the chart where it belongs. Two traits go in two places.</p>
  </header>
  <div class="cstats">
    <div class="nums" id="nums"></div>
    <div class="acts">
      <button class="chip" id="hintBtn">Hint</button>
      <button class="chip" id="revealBtn">Show answers</button>
      <button class="chip" id="resetBtn">Start over</button>
    </div>
  </div>
  <section class="bank" id="bank" aria-label="Traits to place">
    <h2>Traits</h2>
    <div class="chips" id="chips"></div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>
  <section class="chart" id="chart" aria-label="Primate classification chart"></section>
  <p class="foot">Answers follow the worksheet key. Your best result is saved in this browser on this device.</p>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(() => {
  // Rows of the chart, as on the worksheet. "under" says which group each box sits inside.
  const RANKS = [
    { label: "Order", taxa: [["PRI", "Primates", "All primates"]] },
    { label: "Suborder", taxa: [["STR", "Strepsirrhines", "Lemurs, lorises, galagos"], ["HAP", "Haplorrhines", "Tarsiers, monkeys, apes"]] },
    { label: "Infraorder", taxa: [["LEM", "Lemuriformes", "Strepsirrhine"], ["LOR", "Lorisiformes", "Strepsirrhine: lorises & galagos"], ["TAR", "Tarsiiformes", "Haplorrhine: tarsiers"], ["PLA", "Platyrrhines (NWM)", "Haplorrhine"], ["CAT", "Catarrhines", "Haplorrhine"]] },
    { label: "Superfamily", taxa: [["CER", "Cercopithecoidea (OWM)", "Catarrhine"], ["HOM", "Hominoidea (apes)", "Catarrhine"]] }
  ];
  // The worksheet's word bank and its answer key. Two traits are used twice.
  const KEY = [
    ["Prehensile hands and feet", ["PRI"]], ["Opposable thumbs", ["PRI"]], ["Nails and dermatoglyphs", ["PRI"]], ["Binocular & stereoscopic vision", ["PRI"]],
    ["“Wet-nose” primates", ["STR"]], ["Post-orbital bar", ["STR"]], ["Dental comb", ["STR"]], ["Tapetum lucidum", ["STR"]], ["2.1.3.3 dentition", ["STR"]],
    ["Grooming claw", ["STR", "TAR"]],
    ["“Dry-nose” primates", ["HAP"]], ["Post-orbital closure", ["HAP"]], ["Reduced olfaction compared to strepsirrhines", ["HAP"]],
    ["Found only on Madagascar", ["LEM"]],
    ["Small, nocturnal & arboreal", ["LOR", "TAR"]],
    ["Formerly classified as prosimian", ["TAR"]], ["Huge eyes, each as large as the brain", ["TAR"]],
    ["“Broad, sidewards facing nostrils”", ["PLA"]], ["Found in Central & South America", ["PLA"]], ["Prehensile tail in some species", ["PLA"]], ["2.1.3.3 dentition (with exceptions)", ["PLA"]],
    ["“Downward facing nostrils”", ["CAT"]], ["2.1.2.3 dentition", ["CAT"]],
    ["Bilophodont molars", ["CER"]], ["Ischial callosities", ["CER"]],
    ["Y-5 (simple) molars", ["HOM"]], ["No tail", ["HOM"]], ["Modified clavicle/scapula for brachiating", ["HOM"]], ["Longest ontogeny of all primates", ["HOM"]]
  ];
  const NAME = {}; RANKS.forEach(r => r.taxa.forEach(t => NAME[t[0]] = t[1]));
  const CAP = {}; KEY.forEach(([, ts]) => ts.forEach(t => CAP[t] = (CAP[t] || 0) + 1));
  const TOTAL = KEY.reduce((n, [, ts]) => n + ts.length, 0);
  const BEST_KEY = "anthro-chart-best";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [a[k], a[j]] = [a[j], a[k]] } return a };
  const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

  // Reading settings from the drills apply here too
  try {
    const r = JSON.parse(localStorage.getItem("anthro-reading") || "null");
    const stacks = { atkinson: ['"Atkinson Hyperlegible Next",system-ui,sans-serif', "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap"], literata: ['Literata,Georgia,serif', "https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;600;700&display=swap"], system: ['system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'] };
    if (r && stacks[r.font]) { const [st, href] = stacks[r.font]; if (href) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l) } document.documentElement.style.setProperty("--read", st) }
    if (r && [.9, 1, 1.12, 1.25][r.size]) document.documentElement.style.setProperty("--rs", [.9, 1, 1.12, 1.25][r.size]);
  } catch (e) { }

  let placed, left, selected, mistakes, hints, startT, timer, revealed, order, last = null;
  function reset() {
    placed = {}; Object.keys(CAP).forEach(t => placed[t] = []);
    left = {}; KEY.forEach(([w, ts]) => left[w] = ts.length);
    selected = null; last = null; mistakes = 0; hints = 0; startT = 0; revealed = false; clearInterval(timer);
    order = shuffle(KEY.map(k => k[0]));
    render(); say("");
  }
  const placedCount = () => Object.values(placed).reduce((n, a) => n + a.length, 0);
  function say(msg, tone = "") { const s = $("status"); s.textContent = msg; s.className = "status " + tone }
  function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<i></i>${esc(msg)}`; $("toasts").appendChild(t); setTimeout(() => t.remove(), 2600) }
  function nums() {
    const secs = startT ? Math.round((Date.now() - startT) / 1000) : 0;
    let best = null; try { best = JSON.parse(localStorage.getItem(BEST_KEY) || "null") } catch (e) { }
    $("nums").innerHTML = `<span><b>${placedCount()}</b> of ${TOTAL} placed</span><span><b>${mistakes}</b> mistakes</span><span>Time <b>${mmss(secs)}</b></span>${best ? `<span>Best: ${best.m} mistakes in ${mmss(best.s)}</span>` : ""}`;
  }
  function render() {
    // word bank
    const chips = order.filter(w => left[w] > 0).map(w => {
      const two = KEY.find(k => k[0] === w)[1].length > 1;
      return `<button type="button" class="wchip" data-w="${esc(w)}" aria-pressed="${selected === w}">${esc(w)}${two ? `<span class="x2">×${left[w]}</span>` : ""}</button>`;
    }).join("");
    $("chips").innerHTML = chips || "";
    $("bank").hidden = placedCount() === TOTAL;
    $("chips").querySelectorAll(".wchip").forEach(b => b.onclick = () => { selected = selected === b.dataset.w ? null : b.dataset.w; render(); if (selected) say(`Now tap where “${selected}” belongs on the chart.`) });
    // chart
    $("chart").classList.toggle("picking", !!selected);
    $("chart").innerHTML = (placedCount() === TOTAL ? finishCard() : "") + RANKS.map(r => `
      <div class="rank"><div class="rlabel">${r.label}</div>
        <div class="row${r.taxa.length === 1 ? " one" : ""}" style="--n:${r.taxa.length}">
          ${r.taxa.map(([k, name, sub]) => `<button type="button" class="taxon${placed[k].length >= CAP[k] ? " full" : ""}" data-t="${k}" aria-label="${esc(name)}: ${placed[k].length} of ${CAP[k]} placed">
            <span class="tname">${esc(name)}</span><span class="tsub">${esc(sub)}</span>
            <span class="slots">${Array.from({ length: CAP[k] }, (_, i) => placed[k][i] ? `<span class="slot filled${revealed ? " revealed" : ""}${last && last.t === k && last.w === placed[k][i] ? " new" : ""}">${esc(placed[k][i])}</span>` : `<span class="slot"></span>`).join("")}</span>
          </button>`).join("")}
        </div></div>`).join("");
    $("chart").querySelectorAll(".taxon").forEach(b => b.onclick = () => place(b));
    if ($("again")) $("again").onclick = reset;
    nums();
  }
  function place(box) {
    const t = box.dataset.t;
    if (!selected) { say("Pick a trait first, then tap its box."); return }
    if (!startT) { startT = Date.now(); timer = setInterval(nums, 1000) }
    const w = selected, ok = KEY.find(k => k[0] === w)[1];
    if (ok.includes(t) && !placed[t].includes(w) && placed[t].length < CAP[t]) {
      placed[t].push(w); last = { t, w }; left[w]--; selected = left[w] > 0 ? w : null;
      say(`Right: “${w}” goes under ${NAME[t]}.${left[w] > 0 ? " It goes in one more place too." : ""}`, "good");
      render();
      if (placedCount() === TOTAL) finish();
    } else if (ok.includes(t) && placed[t].includes(w)) {
      say(`“${w}” is already under ${NAME[t]}. Its second place is somewhere else.`);
    } else {
      mistakes++; nums();
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      say(`Not ${NAME[t]}. Try another box, or tap Hint.`, "bad");
    }
  }
  function finishCard() {
    const secs = startT ? Math.round((Date.now() - startT) / 1000) : 0;
    return `<div class="card done-card"><h2>${revealed ? "Here's the full chart" : "Chart complete"}</h2>
      <p class="sub">${revealed ? "Answers shown. Start over to try it yourself." : `${TOTAL} traits placed with ${mistakes} mistake${mistakes === 1 ? "" : "s"}${hints ? ` and ${hints} hint${hints === 1 ? "" : "s"}` : ""} in ${mmss(secs)}.`}</p>
      <div class="nav" style="justify-content:center"><button class="btn" id="again"><span>Start over</span></button><a class="btn ghost" href="index.html" style="text-decoration:none"><span>Back to the drill</span></a></div></div>`;
  }
  function finish() {
    clearInterval(timer);
    if (revealed) return;
    const secs = Math.round((Date.now() - startT) / 1000);
    let best = null; try { best = JSON.parse(localStorage.getItem(BEST_KEY) || "null") } catch (e) { }
    if (!best || mistakes < best.m || (mistakes === best.m && secs < best.s)) {
      try { localStorage.setItem(BEST_KEY, JSON.stringify({ m: mistakes, s: secs })) } catch (e) { }
      toast("New best result");
    } else toast("Chart complete");
    nums(); window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $("hintBtn").onclick = () => {
    if (!selected) { say("Pick a trait first, then tap Hint to see where it goes."); return }
    hints++;
    const targets = KEY.find(k => k[0] === selected)[1].filter(t => !placed[t].includes(selected));
    targets.forEach(t => { const b = $("chart").querySelector(`[data-t="${t}"]`); if (b) { b.classList.add("hint"); setTimeout(() => b.classList.remove("hint"), 1600) } });
    say(`Hint: look at ${targets.map(t => NAME[t]).join(" and ")}.`);
  };
  $("revealBtn").onclick = () => {
    revealed = true; clearInterval(timer);
    Object.keys(placed).forEach(t => placed[t] = []);
    KEY.forEach(([w, ts]) => ts.forEach(t => placed[t].push(w)));
    Object.keys(left).forEach(w => left[w] = 0); selected = null;
    render(); say("");
  };
  $("resetBtn").onclick = reset;
  reset();
})();
</script>
</body></html>
