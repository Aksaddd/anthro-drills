<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anthro Exam 2 Drill</title>
<meta name="description" content="ANTH 102 Exam 2 practice: Top Hat, Activity 5, the classification chart, Why Sex, and study-guide practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one study column; three source tabs on top; bubble-sheet answer rows like exam-day Scantron */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#151b2b; --muted:#5b6478; --line:#d6dbe6;
  --accent:#2a46cf; --accent-soft:#e3e8fb; --gold:#b7791f; --gold-soft:#fbf1dc;
  --good:#15803d; --good-soft:#dcf3e3; --bad:#c2410c; --bad-soft:#fde8dc;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131d; --paper:#171c29; --ink:#e7eaf2; --muted:#98a1b6; --line:#2a3245;
  --accent:#8ea2ff; --accent-soft:#232c4f; --gold:#f2c264; --gold-soft:#3a2f17;
  --good:#4ade80; --good-soft:#163323; --bad:#fb923c; --bad-soft:#3a2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131d; --paper:#171c29; --ink:#e7eaf2; --muted:#98a1b6; --line:#2a3245;
  --accent:#8ea2ff; --accent-soft:#232c4f; --gold:#f2c264; --gold-soft:#3a2f17;
  --good:#4ade80; --good-soft:#163323; --bad:#fb923c; --bad-soft:#3a2216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:800 clamp(26px,6vw,34px)/1.05 var(--display);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.tabs{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tab b{font:700 15px/1.2 var(--display);color:var(--ink)}
.tab span{font:500 11.5px var(--mono);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent)}
.tab[aria-selected="true"] b,.tab[aria-selected="true"] span{color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px;color:var(--muted);text-align:center}
.stats b{display:block;font:700 20px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
:is(.chip,.opt,.btn,.tab):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta .val{font:600 13px var(--mono);letter-spacing:0;color:var(--gold);background:var(--gold-soft);padding:1px 8px;border-radius:6px}
.q{font:600 19px/1.4 var(--body);margin:0;text-wrap:pretty}
.fig{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;overflow-x:auto;text-align:center}
.fig img{display:block;margin:0 auto;max-width:100%;height:auto;max-height:340px;object-fit:contain}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:15px/1.4 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.bub{flex:none;width:30px;height:20px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
.opt.picked .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.seq{font-family:var(--mono);letter-spacing:.06em}
.explain{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
.explain strong{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);border:0;border-radius:10px;padding:11px 20px;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted)}
.done{text-align:center;gap:10px}
.done h2{font:800 28px var(--display);margin:0}
.foot{font-size:12.5px;color:var(--muted);margin:0}
@media (max-width:640px){.tabs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.tab b{font-size:13.5px}.q{font-size:17.5px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.back{display:inline-block;font:500 13px var(--body);color:var(--accent);text-decoration:none;margin-bottom:6px}.back:hover{text-decoration:underline}
</style></head><body>
<div class="wrap">
  <header>
    <a class="back" href="../">← All drills</a>
    <h1>Anthro Exam 2 Drill</h1>
    <p class="sub" id="deckSub">Pick a question set. Each one keeps its own progress.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Question set" id="tabs"></nav>
  <div class="stats">
    <div><b id="sMaster">0/0</b>mastered</div>
    <div><b id="sScore">0/0</b>this round</div>
    <div><b id="sStreak">0</b>streak</div>
    <div><b id="sMiss">0</b>to review</div>
  </div>
  <div class="controls">
    <button class="chip" id="shuffleBtn" aria-pressed="true">Shuffled</button>
    <button class="chip" id="missedBtn" aria-pressed="false">Only my missed</button>
    <button class="chip" id="restartBtn">Restart this set</button>
    <button class="chip" id="resetBtn">Clear history</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <main class="card" id="card"></main>
  <p class="foot">Keys: 1–5 to answer, Enter for next. Progress is saved in this browser. <span id="sync"></span></p>
</div>
<script src="questions.js"></script>
<script>
// ===== Build the question index from questions.js
const Q={}, IDS={};
for(const d in DECKS){IDS[d]=[];(DATA[d]||[]).forEach((r,n)=>{const id=d+n;
  Q[id]={d,tag:r[0],q:r[1],ok:r[2],wrong:r[3],ex:r[4]||"",img:r[5]&&FIG[r[5]]?FIG[r[5]]:null};IDS[d].push(id)})}
const FIRST=Object.keys(DECKS)[0];
document.documentElement.style.setProperty("--n",Object.keys(DECKS).length);

// ===== State: saved to this browser (and to a Claude account when opened on claude.ai)
const L="ant2-progress-v1";
let S=fresh();
function fresh(){return {v:2,updatedAt:0,deck:FIRST,shuffle:true,onlyMissed:false,missed:[],hist:{},rounds:{}}}
let missed=new Set(), answered=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
function apply(s){
  if(!s||s.v!==2)return false;
  const n=fresh();
  n.updatedAt=s.updatedAt||0; n.deck=DECKS[s.deck]?s.deck:FIRST; n.shuffle=s.shuffle!==false; n.onlyMissed=!!s.onlyMissed;
  n.missed=(s.missed||[]).filter(id=>Q[id]);
  for(const k in (s.hist||{})) if(Q[k]) n.hist[k]=s.hist[k]?1:0;
  for(const d in DECKS){const r=(s.rounds||{})[d]; if(r&&Array.isArray(r.order)){const order=r.order.filter(id=>Q[id]&&Q[id].d===d);
    n.rounds[d]={order,i:Math.min(r.i|0,order.length),right:r.right|0,done:r.done|0,streak:r.streak|0}}}
  S=n; missed=new Set(S.missed); return true;
}
function local(){try{return JSON.parse(localStorage.getItem(L)||"null")}catch(e){return null}}
let remote=null, pending=null, writing=false, timer=null;
function save(){
  S.updatedAt=Date.now(); S.missed=[...missed];
  try{localStorage.setItem(L,JSON.stringify(S))}catch(e){}
  if(!remote)return; pending=JSON.parse(JSON.stringify(S)); clearTimeout(timer); timer=setTimeout(flush,700);
}
async function flush(){
  if(writing||!pending||!remote)return; writing=true; const s=pending; pending=null;
  try{await remote.set(s);setSync("Synced to your account.")}catch(e){setSync("Saved in this browser only.")}
  writing=false; if(pending)flush();
}
function setSync(t){$("sync").textContent=t}
async function connect(){
  const cl=window.claude; if(!cl||!cl.use){return}
  try{
    const [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
    const uid=user?await user.id():null; if(!db||!uid)return;
    const ref=db.doc("data/users/"+uid+"/exam2-progress-v1");
    const snap=await ref.get(); remote=ref;
    const r=snap.exists?snap.data():null;
    if(r&&(r.updatedAt||0)>S.updatedAt&&apply(JSON.parse(JSON.stringify(r)))){try{localStorage.setItem(L,JSON.stringify(S))}catch(e){} paint()}
    else if(S.updatedAt){pending=JSON.parse(JSON.stringify(S));flush()}
    setSync("Synced to your account.");
  }catch(e){}
}

// ===== Rounds
const R=()=>S.rounds[S.deck];
function newRound(d){
  let ids=IDS[d].slice(); if(S.onlyMissed) ids=ids.filter(id=>missed.has(id));
  S.rounds[d]={order:S.shuffle?shuffle(ids):ids,i:0,right:0,done:0,streak:0};
}
function restart(){newRound(S.deck);answered=false;paint();save()}

// ===== Rendering
function buildTabs(){
  const box=$("tabs"); box.innerHTML="";
  for(const d in DECKS){
    const b=document.createElement("button"); b.className="tab"; b.setAttribute("role","tab"); b.id="tab"+d;
    b.innerHTML=`<b>${DECKS[d].name}</b><span id="tc${d}"></span>`;
    b.onclick=()=>{if(S.deck===d)return;S.deck=d;answered=false;if(!S.rounds[d])newRound(d);paint();save()};
    box.appendChild(b);
  }
}
const mastered=d=>IDS[d].filter(id=>S.hist[id]===1).length;
function stats(){
  for(const d in DECKS){$("tab"+d).setAttribute("aria-selected",d===S.deck);$("tc"+d).textContent=mastered(d)+"/"+IDS[d].length}
  const d=S.deck, r=R();
  $("deckSub").textContent=DECKS[d].sub;
  $("sMaster").textContent=mastered(d)+"/"+IDS[d].length;
  $("sScore").textContent=r.right+"/"+r.done;
  $("sStreak").textContent=r.streak;
  $("sMiss").textContent=IDS[d].filter(id=>missed.has(id)).length;
  $("shuffleBtn").setAttribute("aria-pressed",S.shuffle); $("shuffleBtn").textContent=S.shuffle?"Shuffled":"In order";
  $("missedBtn").setAttribute("aria-pressed",S.onlyMissed);
  $("prog").style.width=r.order.length?(r.i/r.order.length*100)+"%":"0";
}
function paint(){
  if(!S.rounds[S.deck])newRound(S.deck);
  stats(); const c=$("card"), r=R(), d=S.deck;
  if(!r.order.length){
    c.className="card done";
    c.innerHTML=`<h2>Nothing to review</h2><p class="sub">${S.onlyMissed?"No missed questions in this set. Turn off “Only my missed” to see everything.":"No questions here yet."}</p>`;return}
  if(r.i>=r.order.length){
    const pct=r.done?Math.round(r.right/r.done*100):0, m=IDS[d].filter(id=>missed.has(id)).length;
    c.className="card done";
    c.innerHTML=`<h2>${r.right} / ${r.done} · ${pct}%</h2>
    <p class="sub">${m?m+" question"+(m>1?"s":"")+" in this set saved for review.":"Nothing left to review in this set."}</p>
    <div class="nav" style="justify-content:center"><button class="btn" id="again">Go again</button>${m&&!S.onlyMissed?'<button class="btn ghost" id="drill">Drill missed</button>':""}</div>`;
    $("again").onclick=restart;
    if($("drill"))$("drill").onclick=()=>{S.onlyMissed=true;restart()};
    $("prog").style.width="100%";return;
  }
  answered=false;
  const id=r.order[r.i], x=Q[id];
  const opts=shuffle([{t:x.ok,c:true},...x.wrong.map(t=>({t,c:false}))]);
  c.className="card";
  c.innerHTML=`<div class="meta"><span>${esc(x.tag)}</span><span>${r.i+1} of ${r.order.length}</span></div>
  <p class="q">${esc(x.q)}</p>${x.img?`<figure class="fig"><img src="${x.img[0]}" alt="${esc(x.img[1])}"></figure>`:""}
  <div class="opts">${opts.map((o,k)=>`<button class="opt" id="o${k}" data-c="${o.c}"><span class="bub">${"ABCDE"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,id));
}
function pick(b,id){
  if(answered)return; answered=true;
  const x=Q[id], r=R(), good=b.dataset.c==="true";
  $("card").querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.c==="true")o.classList.add("right")});
  b.classList.add("picked"); if(!good)b.classList.add("wrong");
  r.done++; if(good){r.right++;r.streak++;missed.delete(id)}else{r.streak=0;missed.add(id)}
  S.hist[id]=good?1:0; r.i++;
  save(); stats();
  $("fb").innerHTML=`<div class="explain"><strong>${good?"Correct.":"Answer: "+esc(x.ok)}</strong>${esc(x.ex)}</div>
  <div class="nav" style="margin-top:14px"><span class="hint">${good?"":"Saved to your review list."}</span><button class="btn" id="next">Next</button></div>`;
  $("next").onclick=paint; $("next").focus();
}

// ===== Controls
document.addEventListener("keydown",e=>{
  if(!answered&&/^[1-5]$/.test(e.key)){const o=$("o"+(e.key-1));if(o)o.click()}
  else if(answered&&e.key==="Enter"&&$("next")){e.preventDefault();$("next").click()}
});
$("shuffleBtn").onclick=()=>{S.shuffle=!S.shuffle;restart()};
$("missedBtn").onclick=()=>{S.onlyMissed=!S.onlyMissed;restart()};
$("restartBtn").onclick=restart;
let armed=null;
$("resetBtn").onclick=e=>{
  const b=e.currentTarget;
  if(!armed){b.textContent="Tap again to erase all progress";b.classList.add("warn");armed=setTimeout(()=>{armed=null;b.textContent="Clear history";b.classList.remove("warn")},3000);return}
  clearTimeout(armed);armed=null;b.textContent="Clear history";b.classList.remove("warn");
  const deck=S.deck; S=fresh(); S.deck=deck; missed=new Set(); restart();
};
buildTabs();
apply(local());
paint();
connect();
</script>
</body></html>
